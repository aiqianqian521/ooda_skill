interface:
  display_name: "OODA"
  short_description: "Mandatory OODA rounds until verified solved, route declared on line 1."
  default_prompt: "Use this skill to guide my task with OODA logic. Clarify my purpose first, then write mandatory records under work_ooda/{YYYYMMDD-HHMMSS}-{task-slug}/ in the current project: 00-purpose.md, one 0{N}-round-{N}.md per round, a new state-R{N}.md per round (never overwrite a previous one), and summary.md with a restore_anchor. Take timestamps from the shell (date '+%Y-%m-%dT%H:%M:%S%z'; PowerShell Get-Date -Format o) and declare time_source: unavailable if no shell is available — never write a placeholder or a guessed time. Show each OODA step's current logic to me, reread relevant files each round, track delta checks and severity, verify both result and execution path, rerun until verified solved, and ask me instead of guessing when intent, context, risk, repeated failure, or tradeoffs are unclear."
